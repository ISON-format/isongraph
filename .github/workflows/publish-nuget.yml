# NuGet/login exchanges this workflow's GitHub OIDC token for a short-lived
# API key, which requires a trusted publishing policy on nuget.org naming
# exactly:
#
#   Repository Owner : ISON-format
#   Repository       : isongraph
#   Workflow File    : publish-nuget.yml     <- this file's name
#   Environment      : (blank, unless `environment:` is set on the job below)
#
# The policy must be created by the same nuget.org account named in `user:`
# below - the error distinguishes the policy *creator* from the package
# *owner*, and only the creator's name works here.
#
# This repo moved from the `isongraph` org to `ISON-format`, so a policy
# created against the old owner no longer matches and fails with HTTP 401.
# Renaming this file breaks the policy's workflow_ref claim; update both.

name: Publish NuGet package

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for NuGet Trusted Publishing (OIDC)
      contents: read
    defaults:
      run:
        working-directory: ison-graph-cs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build -warnaserror
      - run: dotnet test --no-build
      - run: dotnet pack src/IsonGraph -c Release -o out
      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: maheshvaikri
      - name: Push to NuGet
        run: dotnet nuget push out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
